# Infra dos testes de integração e concorrência. Portas diferentes da infra de dev para
# os dois rodarem juntos; Postgres em tmpfs porque o estado de teste é descartável.

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  sqs-test:
    image: ${SQS_EMULATOR_IMAGE:-ministackorg/ministack:latest}
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      SERVICES: sqs
    ports:
      - "54566:4566"
    healthcheck:
      # A imagem do MiniStack não traz curl nem wget; usa o python3 que ela já embarca.
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4566/_localstack/health').status==200 else 1)\"",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
